[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricebell"
version = "0.1.0"
description = "Telegram bot that alerts users when asset prices hit targets: Thai and US stocks, ETFs, gold, oil and USD/THB"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2",
    "python-telegram-bot>=21",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]